<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zzcms - B&W Glass Student Notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="bg-layer"></div>

  <!-- HERO -->
  <section class="hero">
    <h1>zzcms</h1>
    <a href="#dashboard" class="btn-glass">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      START
    </a>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" class="dashboard">
    <header class="dash-header">
      <div class="dash-header-title">
        <h2>Panel lekcji</h2>
        <span class="auth-status-tag" id="authStatusTag">Tryb podglądu (Gość)</span>
      </div>
      
      <div class="dash-header-actions">
        <!-- Przycisk logowania administratora -->
        <button id="openLoginBtn" class="btn-glass" title="Zaloguj jako Administrator">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Zaloguj (Admin)</span>
        </button>

        <!-- Przyciski akcji widoczne wyłącznie dla zalogowanego administratora -->
        <div id="adminControls" class="admin-controls" style="display: none;">
          <button id="addLessonBtn" class="btn-glass btn-glass-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Dodaj nową lekcję
          </button>
          
          <button id="logoutBtn" class="btn-glass btn-icon" title="Wyloguj administratora">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="grid" id="lessonsGrid">
      
      <!-- ADD CARD STUB (widoczny tylko dla administratora) -->
      <div class="glass-card glass-card-tile add-stub" id="addCardStub" role="button" tabindex="0">
        <div class="add-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <span>Dodaj nową lekcję</span>
      </div>

    </div>
  </section>

  <!-- LESSON MODAL -->
  <dialog id="lessonModal" class="modal-glass modal-expanded">
    <form id="lessonForm" method="dialog">
      <header class="modal-header">
        <h3 id="modalTitle">Dodaj materiały z zajęć</h3>
        <button type="button" class="btn-close-icon" id="closeIconBtn" aria-label="Zamknij">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>

      <div class="modal-body">
        <input type="hidden" id="editCardId" name="editCardId" value="">

        <div class="form-grid">
          <div class="form-group full-width">
            <label>Temat zajęć <input type="text" name="title" required placeholder="np. Interfejsy i polimorfizm"></label>
          </div>
          <div class="form-group">
            <label>Przedmiot <input type="text" name="subject" placeholder="np. Programowanie Obiektowe"></label>
          </div>
          <div class="form-group">
            <label>Data <input type="date" name="date"></label>
          </div>
        </div>

        <div class="form-group full-width">
          <label>Główne notatki <textarea name="notes" rows="5" placeholder="Wpisz definicje, zagadnienia z wykładu..."></textarea></label>
        </div>

        <div class="form-group full-width">
          <label>Kod źródłowy / Terminal <textarea name="code" rows="4" class="code-input" placeholder="Wklej skrypty, kod źródłowy lub komendy..."></textarea></label>
        </div>

        <div class="form-group full-width">
          <label>Przydatne linki <input type="text" name="links" placeholder="Wklej adresy URL (oddzielone spacją)"></label>
        </div>

        <div class="form-group full-width">
          <label>Tagi <input type="text" name="tags" placeholder="np. c#, teoria, kolokwium (po przecinku)"></label>
        </div>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn-glass" id="closeModal">Anuluj</button>
        <button type="submit" class="btn-glass btn-glass-primary" id="submitBtn">Zapisz</button>
      </footer>
    </form>
  </dialog>

  <!-- LOGIN MODAL -->
  <dialog id="loginModal" class="modal-glass" style="max-width: 420px;">
    <form id="loginForm" method="dialog">
      <header class="modal-header">
        <h3>Logowanie Administratora</h3>
        <button type="button" class="btn-close-icon" id="closeLoginModal" aria-label="Zamknij">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>

      <div class="modal-body">
        <div class="form-group full-width">
          <label>Login <input type="text" name="username" id="loginUsername" required autocomplete="username" placeholder="Wpisz login"></label>
        </div>

        <div class="form-group full-width">
          <label>Hasło <input type="password" name="password" id="loginPassword" required autocomplete="current-password" placeholder="Wpisz hasło"></label>
        </div>

        <div id="loginErrorMsg" class="login-error-msg" style="display: none;"></div>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn-glass" id="cancelLoginBtn">Anuluj</button>
        <button type="submit" class="btn-glass btn-glass-primary" id="submitLoginBtn">Zaloguj</button>
      </footer>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
